name: Fork APK Release

on:
  push:
    branches: [ci-build]

permissions:
  contents: read

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'GeorgieWu/YumaPlayer'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Restore and validate release signing key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEY ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          mkdir -p app/keystore
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > app/keystore/release.keystore
          keytool -list -keystore app/keystore/release.keystore \
            -storepass:env STORE_PASSWORD -alias "$ALIAS" > /dev/null

      - name: Build signed mobile universal APK
        env:
          ALIAS: ${{ secrets.ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          NIGHTLY_BUILD_HASH: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_ATTEMPT >= 100 )); then
            echo '::error::Push a new commit after 99 attempts to keep version codes unique.'
            exit 1
          fi
          VERSION_CODE=$((100000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PforkVersionCode="$VERSION_CODE" \
            :app:assembleGmsMobileUniversalRelease

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/package-fork-apk.py
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose dist/app-gms-mobile-universal-release.apk
          cd dist
          sha256sum app-gms-mobile-universal-release.apk > SHA256SUMS.txt

      - name: Remove restored signing key
        if: always()
        shell: bash
        run: rm -f app/keystore/release.keystore

      - uses: actions/upload-artifact@v7
        with:
          name: fork-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fork-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Publish fork prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/app-gms-mobile-universal-release.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "YumaPlayer fork $VERSION" \
            --notes-file dist/release-notes.md --draft --prerelease
          gh release edit "$TAG" --draft=false
          printf 'APK download: https://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$TAG" >> "$GITHUB_STEP_SUMMARY"
