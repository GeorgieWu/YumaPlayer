name: Fork APK Release

on:
  push:
    branches: [ci-build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'GeorgieWu/YumaPlayer' && github.ref == 'refs/heads/ci-build'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_PATH: app/build/outputs/apk/gmsMobileArm64/release/app-gms-mobile-arm64-release.apk
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Restore release signing key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p app/keystore
          printf '%s' "${ANDROID_SIGNING_KEY:?Missing ANDROID_SIGNING_KEY secret}" \
            | base64 --decode > app/keystore/release.keystore

      - name: Build signed GMS arm64 APK
        env:
          ALIAS: ${{ secrets.ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          CANVAS_TIDAL_TOKEN: ${{ secrets.CANVAS_TIDAL_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_ATTEMPT >= 100 )); then
            echo '::error::Push a new commit after 99 attempts to keep version codes unique.'
            exit 1
          fi
          VERSION_CODE=$((100000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          ./gradlew --no-daemon --no-parallel --max-workers=1 --build-cache \
            -Dorg.gradle.jvmargs='-Xmx8g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PforkCi=true -PforkVersionCode="$VERSION_CODE" \
            :app:assembleGmsMobileArm64Release

      - name: Remove restored signing key
        if: always()
        run: rm -f app/keystore/release.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-gms-mobile-arm64-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish fork prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(python3 <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = Path(os.environ["APK_PATH"]).with_name("output-metadata.json")
          print(json.loads(metadata.read_text())["elements"][0]["versionName"])
          PY
          )"
          NOTES="$(printf 'GMS · mobile · arm64-v8a\n\nCommit: %s/%s/commit/%s\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          RELEASE_URL="$(gh release create "fork-v$VERSION" "$APK_PATH" \
            --target "$GITHUB_SHA" --title "YumaPlayer fork $VERSION" \
            --notes "$NOTES" --prerelease)"
          printf '[Download APK](%s)\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
